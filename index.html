<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Review Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Replace with Google Cloud OAuth Web Client ID -->
  <meta name="google-client-id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <main class="page">
    <section class="review-card">

      <!-- Organization logo from the QR link; initials shown when no logo is supplied -->
      <div class="google-logo organization-logo" id="organizationLogo" aria-label="Organization logo">
        <img id="organizationLogoImage" alt="" hidden>
        <span id="organizationLogoFallback" aria-hidden="true">ORG</span>
      </div>

      <p class="eyebrow">SHARE YOUR EXPERIENCE</p>

      <h1>Share Your Experience!</h1>

      <p class="subtitle">
        Your honest feedback helps us improve.<br>
        It only takes a few seconds.
      </p>

      <!-- Rating -->
      <div class="rating-wrap">
        <div class="stars" aria-label="Review on Google">
          <span>★</span>
          <span>★</span>
          <span>★</span>
          <span>★</span>
          <span>★</span>
        </div>
        <p class="rating-text">All experiences and ratings are welcome</p>
      </div>

      <!-- Editable prompts: visitors must describe their own genuine experience -->
      <div class="review-box">
        <span class="quote">“</span>

        <textarea id="reviewText" aria-label="Write your honest review" rows="5">
          I tried [service/product]. My experience was [describe what actually happened].
        </textarea>

          <button class="secondary-btn idea-btn" id="ideaBtn" type="button">
            <span class="btn-icon">↻</span>
            Another Suggestion
          </button>
        </div>
      </div>

      <!-- Google CTA -->
      <button class="google-btn" id="googleBtn" type="button">
        <span class="google-mini">G</span>
        <span>Copy &amp; Review</span>
        <span class="arrow">→</span>
      </button>

      <div class="trust">
        <span class="lock">⌾</span>
        Takes less than a minute
        <span class="dot">•</span>
        Thank you for your feedback
      </div>

      <!-- Coupons remain last and independent of leaving a review -->
      <div class="coupons-section">
        <div class="coupons-heading"><h2>🎁 Available Coupons</h2><span>Store Offers</span></div>
        <div class="coupons-list" id="couponsList"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Review text copied!</div>

  <script src="script.js"></script>
</body>
</html>
